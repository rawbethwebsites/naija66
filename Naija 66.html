<title>Naija 66</title>
<meta name="theme-color" content="#064E3B">
<style>
@import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap");

:root {
  --bg: #064E3B;
  --bg-deep: #032E22;
  --fg: #FFF8F0;
  --green: #0A6847;
  --green-light: #11A87A;
  --green-bright: #16C098;
  --gold: #F4A900;
  --gold-light: #FFD166;
  --coral: #E85D4A;
  --indigo: #1B1464;
  --cream: #FFF8F0;
  --charcoal: #1A1A2E;
  --glass-bg: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.12);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #064E3B; --fg: #FFF8F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #064E3B; --fg: #FFF8F0;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(10,104,71,.6) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(244,169,0,.08) 0%, transparent 50%);
  color: var(--fg);
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100dvh;
  padding-inline: 16px;
}

.display { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }

button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
input { font: inherit; }

.btn-gold {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 16px; padding: 16px 32px;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 600; font-size: 18px;
  background: var(--gold); color: var(--charcoal);
  transition: transform .15s, background .15s;
}
.btn-gold:hover { background: var(--gold-light); }
.btn-gold:active { transform: scale(.95); }

.btn-coral {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 16px; padding: 16px 32px;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 600; font-size: 18px;
  background: var(--coral); color: var(--cream);
  transition: transform .15s;
}
.btn-coral:active { transform: scale(.95); }

.btn-outline {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 16px; padding: 14px 24px;
  font-weight: 600; font-size: 15px;
  border: 2px solid var(--glass-border);
  background: var(--glass-bg);
  transition: all .15s;
}
.btn-outline:hover { border-color: rgba(255,248,240,.25); background: rgba(255,248,240,.1); }
.btn-outline:active { transform: scale(.95); }

.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
}

.back-btn {
  color: rgba(255,248,240,.4); font-size: 14px;
  align-self: flex-start; margin-bottom: 24px; padding: 4px 0;
}

.screen {
  min-height: 100dvh; display: flex; flex-direction: column;
  padding-block: 24px; max-width: 480px; margin-inline: auto;
}

.pattern-dots {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .03;
  background-image: radial-gradient(circle, var(--cream) 1px, transparent 1px);
  background-size: 24px 24px;
}

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseGlow { 0%,100% { filter: drop-shadow(0 0 8px rgba(244,169,0,.3)); } 50% { filter: drop-shadow(0 0 24px rgba(244,169,0,.6)); } }
@keyframes countPulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes correctFlash { 0% { box-shadow: 0 0 0 0 rgba(17,168,122,.6); } 100% { box-shadow: 0 0 0 16px rgba(17,168,122,0); } }
@keyframes streakPop { 0% { transform: scale(0) rotate(-10deg); opacity: 0; } 60% { transform: scale(1.2) rotate(3deg); } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
@keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
@keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.fade-up { animation: fadeUp .5s ease-out both; }
.fade-up-d1 { animation-delay: .1s; }
.fade-up-d2 { animation-delay: .2s; }
.fade-up-d3 { animation-delay: .3s; }
.fade-up-d4 { animation-delay: .4s; }
.fade-up-d5 { animation-delay: .5s; }

.timer-ring { stroke-dasharray: 283; transition: stroke-dashoffset 1s linear; }

.state-grid::-webkit-scrollbar { width: 4px; }
.state-grid::-webkit-scrollbar-track { background: transparent; }
.state-grid::-webkit-scrollbar-thumb { background: rgba(255,248,240,.15); border-radius: 2px; }

.opt-btn {
  width: 100%; text-align: left; padding: 16px 20px;
  border-radius: 16px; font-size: 16px; font-weight: 500;
  border: 2px solid var(--glass-border);
  background: var(--glass-bg);
  transition: all .15s;
}
.opt-btn:hover { border-color: rgba(255,248,240,.25); background: rgba(255,248,240,.1); }
.opt-btn:active { transform: scale(.97); }
.opt-btn.correct { border-color: var(--green-light); background: rgba(17,168,122,.2); animation: correctFlash .4s ease-out; }
.opt-btn.wrong { border-color: var(--coral); background: rgba(232,93,74,.15); animation: shake .4s ease-out; }
.opt-btn[disabled] { pointer-events: none; opacity: .7; }

.streak-badge {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  z-index: 50; padding: 8px 20px; border-radius: 24px;
  background: var(--gold); color: var(--charcoal);
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 700; font-size: 16px;
  animation: streakPop .4s ease-out both;
  pointer-events: none;
}

.pride-card {
  width: 100%; max-width: 360px; aspect-ratio: 1;
  border-radius: 24px; overflow: hidden; position: relative;
  background: linear-gradient(145deg, var(--bg-deep) 0%, #053D2C 50%, #0A6847 100%);
}
.pride-card::before {
  content: ''; position: absolute; inset: 0; opacity: .1;
  background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,248,240,.05) 20px, rgba(255,248,240,.05) 21px);
}

.zone-path { cursor: pointer; transition: all .2s; }
.zone-path:hover { filter: brightness(1.3); }
.zone-path.active { filter: brightness(1.5) drop-shadow(0 0 12px rgba(17,168,122,.5)); }
.zone-path.completed { filter: brightness(1.2) saturate(1.3); }
.zone-path.dimmed { opacity: .35; cursor: default; }

.profile-badge {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-radius: 999px;
  background: rgba(255,248,240,.06);
  border: 1px solid rgba(255,248,240,.08);
}

.tone-badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: .5px;
}

/* Game card tiles */
.game-tile {
  border-radius: 20px; padding: 24px; text-align: left;
  transition: transform .15s;
  border: 2px solid var(--glass-border);
  background: var(--glass-bg);
}
.game-tile:active { transform: scale(.96); }

/* True/False buttons */
.tf-btn {
  flex: 1; padding: 24px; border-radius: 20px;
  font-size: 20px; font-weight: 700;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  transition: all .15s;
}
.tf-btn:active { transform: scale(.95); }
.tf-true { background: rgba(17,168,122,.15); border: 2px solid rgba(17,168,122,.3); color: var(--green-light); }
.tf-false { background: rgba(232,93,74,.15); border: 2px solid rgba(232,93,74,.3); color: var(--coral); }
.tf-btn.picked-right { background: rgba(17,168,122,.4); border-color: var(--green-light); }
.tf-btn.picked-wrong { background: rgba(232,93,74,.4); border-color: var(--coral); animation: shake .4s ease-out; }

/* Quote card */
.quote-card {
  border-radius: 20px; padding: 32px 24px;
  background: rgba(255,255,255,.04);
  border-left: 4px solid var(--gold);
  font-size: 18px; line-height: 1.6;
  font-style: italic;
  color: rgba(255,248,240,.9);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>

<div id="app"></div>

// Helper: render a blobatar avatar at a given size
function avatar(name, size) {
  return blobatar(name || 'naija', { size, background: 'squircle' });

// ============================================================
// GAZE TRACKING — eyes follow the cursor
// ============================================================
const gazeState = { mx: -1e6, my: -1e6, raf: 0, targets: [] };

// Start listening for mouse movement immediately
document.addEventListener('mousemove', (e) => {
  gazeState.mx = e.clientX;
  gazeState.my = e.clientY;
  if (!gazeState.raf && gazeState.targets.length > 0) {
    gazeState.raf = requestAnimationFrame(gazeTick);
  }
}, { passive: true });

function registerGaze(svgEl) {
  if (!svgEl || !svgEl.querySelector) return;
  // Find the eye group — in blobatar's SVG structure it's the last <g> with <path> children
  // The head group contains <circle> (petals) + <path> (body), the eye group only <path>
  // Some shapes may not have circles, so we use position: eye group comes after head group
  const groups = svgEl.querySelectorAll(':scope > g');
  let eyeGroup = null;
  
  // Try direct children first (static mode - no animation wrapper)
  if (groups.length >= 2) {
    // Eye group is the last top-level <g> (head is first)
    eyeGroup = groups[groups.length - 1];
  }
  
  // If no direct children groups, look deeper (animation wrapper mode)
  if (!eyeGroup) {
    const allGroups = svgEl.querySelectorAll('g');
    // Find the group that has only <path> children (no <circle>)
    for (const g of allGroups) {
      const hasCircles = g.querySelectorAll('circle').length > 0;
      const hasPaths = g.querySelectorAll('path').length > 0;
      if (!hasCircles && hasPaths && !g.classList.contains('mo-breathe') && !g.classList.contains('mo-bob')) {
        eyeGroup = g;
        break;
      }
    }
  }
  
  if (!eyeGroup) return;
  
  gazeState.targets.push({ svg: svgEl, eyes: eyeGroup });
  // Start the gaze loop if mouse position is known
  if (!gazeState.raf && gazeState.mx > -1e6) {
    gazeState.raf = requestAnimationFrame(gazeTick);
  }
}

function gazeTick() {
  gazeState.raf = 0;
  const mx = gazeState.mx, my = gazeState.my;
  
  for (const t of gazeState.targets) {
    if (!document.body.contains(t.svg)) continue;
    const rect = t.svg.getBoundingClientRect();
    if (rect.width === 0) continue;
    
    // Center of the SVG in viewport coords
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    
    // Direction from center to mouse, normalized -1..1
    const dx = (mx - cx) / (rect.width / 2);
    const dy = (my - cy) / (rect.height / 2);
    
    // Distance — if mouse is on the avatar, reduce travel (deadzone)
    const dist = Math.hypot(dx, dy);
    const deadzone = 0.55;
    const amp = dist > 0 ? Math.min(1, Math.max(0, (dist - deadzone) / (1 - deadzone))) : 0;
    
    // Max travel in viewBox units (eyes move up to ~3 units)
    const travel = 3;
    const tx = dist > 0 ? (dx / dist) * amp * travel : 0;
    const ty = dist > 0 ? (dy / dist) * amp * travel : 0;
    
    // Apply transform — translate in viewBox units (SVG transform)
    t.eyes.setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`);
  }
  
  // Keep the loop alive as long as there are targets
  if (gazeState.targets.length > 0) {
    gazeState.raf = requestAnimationFrame(gazeTick);
  }
}

// After each render, find avatar SVGs and register them for gaze
function setupGazeAfterRender() {
  // Clear previous targets since innerHTML was replaced
  gazeState.targets = [];
  const svgs = document.querySelectorAll('#app svg');
  for (const svg of svgs) {
    registerGaze(svg);
  }
}

function shuffle(arr) {
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
}
function shuffleOptions(q) {
  const idx=q.options.map((_,i)=>i), sh=shuffle(idx);
  return { options:sh.map(i=>q.options[i]), correctIndex:sh.indexOf(q.correctIndex) };
}

function checkAchievements() {
  const a=profile.achievements;
  if(profile.gamesPlayed>=1&&!a.includes("first_game"))a.push("first_game");
  if(profile.gamesPlayed>=10&&!a.includes("veteran"))a.push("veteran");
  if(profile.highScore>=2000&&!a.includes("legend"))a.push("legend");
  if(profile.bestStreak>=5&&!a.includes("on_fire"))a.push("on_fire");
  if(profile.bestStreak>=10&&!a.includes("unstoppable"))a.push("unstoppable");
  if(profile.totalCorrect>=66&&!a.includes("naija_scholar"))a.push("naija_scholar");
  if(profile.completedZones.length>=2&&!a.includes("explorer"))a.push("explorer");
  saveProfile(profile);
}

// ============================================================
// GAME ENGINE (shared timer + scoring)
// ============================================================

function startGame() {
  state.currentQ=0; state.score=0; state.correct=0; state.streak=0; state.bestStreak=0;
  state.timeLeft=66; state.frozen=false; state.answered=[]; state.showStreak=false;

  const gid=state.selectedGame||"quiz";
  if(gid==="quiz"){state.questions=shuffle(QUESTIONS);go("game-play");}
  else if(gid==="whosaidit"){state.questions=shuffle(QUOTES);go("game-play-quote");}
  else if(gid==="namestate"){state.questions=shuffle(STATE_CLUES);go("game-play-state");}
  else if(gid==="jollof"){state.questions=shuffle(JOLLOF_FACTS);go("game-play-jollof");}
  else if(gid==="pidgin"){state.questions=shuffle(PIDGIN_PHRASES);go("game-play-pidgin");}

  state.timerInterval=setInterval(()=>{
    if(!state.frozen){state.timeLeft=Math.max(0,state.timeLeft-1);updateTimerUI();if(state.timeLeft<=0)endGame();}
  },1000);
}

function updateTimerUI(){
  const el=$("timerText"),ring=$("timerRing"),bar=$("progressBar");
  if(el){el.textContent=state.timeLeft;if(state.timeLeft<=10){el.style.color="var(--coral)";el.style.animation="countPulse .5s ease-out";setTimeout(()=>{if(el)el.style.animation="";},500);}}
  if(ring){const p=state.timeLeft/66;ring.style.strokeDashoffset=283*(1-p);ring.style.stroke=state.timeLeft<=10?"var(--coral)":state.frozen?"rgba(255,248,240,.2)":"var(--gold)";}
  if(bar){bar.style.width=((state.timeLeft/66)*100)+"%";bar.style.background=state.timeLeft<=10?"var(--coral)":"var(--gold)";}
}

function gameHeader(){
  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <button class="back-btn" style="margin:0" onclick="endGame()">✕</button>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="display" style="font-weight:700;font-size:14px;color:var(--gold)">${state.score} pts</div>
      ${state.streak>=2?`<div style="padding:4px 10px;border-radius:999px;background:rgba(244,169,0,.2);font-size:12px;font-weight:600;color:var(--gold)">\u{1F525} ${state.streak}</div>`:''}
    </div>
  </div>
  <div style="display:flex;align-items:center;justify-content:center;margin-bottom:20px;position:relative">
    <svg width="80" height="80" viewBox="0 0 100 100" style="transform:rotate(-90deg)">
      <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,248,240,.08)" stroke-width="6"/>
      <circle id="timerRing" cx="50" cy="50" r="45" fill="none" stroke="var(--gold)" stroke-width="6" class="timer-ring" stroke-linecap="round" style="stroke-dashoffset:${283*(1-state.timeLeft/66)}"/>
    </svg>
    <div id="timerText" class="display" style="position:absolute;font-weight:700;font-size:28px;color:${state.timeLeft<=10?'var(--coral)':'var(--cream)'}">${state.timeLeft}</div>
  </div>
  <div style="width:100%;height:4px;border-radius:2px;background:rgba(255,248,240,.08);margin-bottom:20px;overflow:hidden">
    <div id="progressBar" style="height:100%;border-radius:2px;background:var(--gold);transition:width .3s;width:${(state.timeLeft/66)*100}%"></div>
  </div>
  ${state.frozen?'<div style="text-align:center;color:var(--coral);font-weight:600;font-size:14px;margin-bottom:16px;animation:shake .3s">⏸ Clock frozen — 3s penalty</div>':''}`;
}

function handleCorrect(extraData){
  state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);
  let pts=100;
  if(state.streak>=5){pts=300;state.streakText="\u{1F525} ON FIRE! +300";}
  else if(state.streak>=3){pts=200;state.streakText="\u{1F525} Streak x"+state.streak+"! +200";}
  else{state.streakText="";}
  state.score+=pts;state.correct++;
  if(state.streak>=3){state.showStreak=true;setTimeout(()=>{state.showStreak=false;},1200);}
}
function handleWrong(){state.streak=0;state.frozen=true;setTimeout(()=>{state.frozen=false;advanceQuestion();},3000);}

function advanceQuestion(){
  state.currentQ++;
  if(state.currentQ>=state.questions.length){state.questions=shuffle(state.questions);state.currentQ=0;}
  render();
}

// ============================================================
// GAME 1: 66-Second Quiz
// ============================================================

function renderGamePlay() {
  if(state.currentQ>=state.questions.length){state.questions=shuffle(QUESTIONS);state.currentQ=0;}
  const q=state.questions[state.currentQ],qNum=state.answered.length+1;
  const tone=TONE_STYLES[q.tone]||TONE_STYLES.fun;
  const sh=shuffleOptions(q);state.currentShuffled=sh;
  app.innerHTML=`<div class="screen" style="padding-top:16px">
    ${gameHeader()}
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="color:rgba(255,248,240,.4);font-size:13px">Question ${qNum}</span>
        <span class="tone-badge" style="background:${tone.bg};color:${tone.color}">${tone.label}</span>
      </div>
      <h2 class="display" style="font-weight:600;font-size:20px;line-height:1.4;margin-bottom:28px;text-wrap:balance">${q.question}</h2>
      <div id="optionsArea" style="display:flex;flex-direction:column;gap:12px">
        ${sh.options.map((o,i)=>`<button class="opt-btn" id="opt${i}" onclick="answerQuiz(${i})">${o}</button>`).join("")}
      </div>
    </div>
  </div>${state.showStreak?`<div class="streak-badge">${state.streakText}</div>`:''}`;
}

function answerQuiz(idx){
  if(state.frozen)return;
  const q=state.questions[state.currentQ],ci=state.currentShuffled.correctIndex,ok=idx===ci;
  const btns=document.querySelectorAll(".opt-btn");
  btns.forEach((b,i)=>{b.disabled=true;if(i===ci)b.classList.add("correct");if(i===idx&&!ok)b.classList.add("wrong");});
  state.answered.push({question:q,correct:ok,chosen:idx});
  if(ok){handleCorrect();setTimeout(()=>advanceQuestion(),600);}
  else handleWrong();
}

// ============================================================
// GAME 2: Who Said It?
// ============================================================

function renderGamePlayQuote(){
  if(state.currentQ>=state.questions.length){state.questions=shuffle(QUOTES);state.currentQ=0;}
  const q=state.questions[state.currentQ],qNum=state.answered.length+1;
  const ci=q.options.indexOf(q.person);
  const sh=shuffleOptions({options:q.options,correctIndex:ci});state.currentShuffled=sh;
  app.innerHTML=`<div class="screen" style="padding-top:16px">
    ${gameHeader()}
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div style="color:rgba(255,248,240,.4);font-size:13px;margin-bottom:12px">Quote ${qNum} — Who said this?</div>
      <div class="quote-card" style="margin-bottom:28px">“${q.quote}”</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${sh.options.map((o,i)=>`<button class="opt-btn" onclick="answerQuote(${i})">${o}</button>`).join("")}
      </div>
    </div>
  </div>${state.showStreak?`<div class="streak-badge">${state.streakText}</div>`:''}`;
}

function answerQuote(idx){
  if(state.frozen)return;
  const q=state.questions[state.currentQ],ci=state.currentShuffled.correctIndex,ok=idx===ci;
  const btns=document.querySelectorAll(".opt-btn");
  btns.forEach((b,i)=>{b.disabled=true;if(i===ci)b.classList.add("correct");if(i===idx&&!ok)b.classList.add("wrong");});
  state.answered.push({question:{question:'Who said: "'+q.quote+'"',realStory:{fact:q.fact,date:"",source:""}},correct:ok});
  if(ok){handleCorrect();setTimeout(()=>advanceQuestion(),600);}
  else handleWrong();
}

// ============================================================
// GAME 3: Name That State
// ============================================================

function renderGamePlayState(){
  if(state.currentQ>=state.questions.length){state.questions=shuffle(STATE_CLUES);state.currentQ=0;}
  const q=state.questions[state.currentQ],qNum=state.answered.length+1;
  // Pick random clue to show
  const clue=q.clues[Math.floor(Math.random()*q.clues.length)];
  // Build 4 options: correct + 3 random wrong states
  const others=shuffle(STATE_CLUES.filter(s=>s.state!==q.state)).slice(0,3).map(s=>s.state);
  const opts=shuffle([q.state,...others]);
  const ci=opts.indexOf(q.state);
  state.currentShuffled={options:opts,correctIndex:ci};
  app.innerHTML=`<div class="screen" style="padding-top:16px">
    ${gameHeader()}
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div style="color:rgba(255,248,240,.4);font-size:13px;margin-bottom:12px">State ${qNum} — Name that state!</div>
      <div class="glass" style="padding:24px;margin-bottom:28px;text-align:center">
        <div style="font-size:32px;margin-bottom:12px">\u{1F5FA}</div>
        <p class="display" style="font-weight:600;font-size:18px;line-height:1.5;color:var(--cream)">${clue}</p>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        ${opts.map((o,i)=>`<button class="opt-btn" style="text-align:center" onclick="answerState(${i})">${o}</button>`).join("")}
      </div>
    </div>
  </div>${state.showStreak?`<div class="streak-badge">${state.streakText}</div>`:''}`;
}

function answerState(idx){
  if(state.frozen)return;
  const q=state.questions[state.currentQ],ci=state.currentShuffled.correctIndex,ok=idx===ci;
  const btns=document.querySelectorAll(".opt-btn");
  btns.forEach((b,i)=>{b.disabled=true;if(i===ci)b.classList.add("correct");if(i===idx&&!ok)b.classList.add("wrong");});
  state.answered.push({question:{question:"Which state? Clue shown.",realStory:{fact:q.clues.join(". "),date:"",source:"Nigerian Geography"}},correct:ok});
  if(ok){handleCorrect();setTimeout(()=>advanceQuestion(),600);}
  else handleWrong();
}

// ============================================================
// GAME 4: Jollof or No Jollof (True/False)
// ============================================================

function renderGamePlayJollof(){
  if(state.currentQ>=state.questions.length){state.questions=shuffle(JOLLOF_FACTS);state.currentQ=0;}
  const q=state.questions[state.currentQ],qNum=state.answered.length+1;
  app.innerHTML=`<div class="screen" style="padding-top:16px">
    ${gameHeader()}
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div style="color:rgba(255,248,240,.4);font-size:13px;margin-bottom:12px">Fact ${qNum} — Jollof or No Jollof?</div>
      <div class="glass" style="padding:28px;margin-bottom:32px;text-align:center">
        <p class="display" style="font-weight:600;font-size:20px;line-height:1.5;text-wrap:balance">${q.statement}</p>
      </div>
      <div style="display:flex;gap:16px">
        <button class="tf-btn tf-true" onclick="answerJollof(true)">\u{1F35A} Jollof!<br><span style="font-size:12px;font-weight:400;opacity:.6">True</span></button>
        <button class="tf-btn tf-false" onclick="answerJollof(false)">\u{1F645} No Jollof<br><span style="font-size:12px;font-weight:400;opacity:.6">False</span></button>
      </div>
    </div>
  </div>${state.showStreak?`<div class="streak-badge">${state.streakText}</div>`:''}`;
}

function answerJollof(guess){
  if(state.frozen)return;
  const q=state.questions[state.currentQ],ok=guess===q.isTrue;
  const btns=document.querySelectorAll(".tf-btn");
  btns.forEach(b=>b.disabled=true);
  if(guess){btns[0].classList.add(ok?"picked-right":"picked-wrong");}
  else{btns[1].classList.add(ok?"picked-right":"picked-wrong");}
  state.answered.push({question:{question:q.statement,realStory:{fact:q.explanation,date:"",source:""}},correct:ok});
  if(ok){handleCorrect();setTimeout(()=>advanceQuestion(),600);}
  else handleWrong();
}

// ============================================================
// GAME 5: Pidgin Translator
// ============================================================

function renderGamePlayPidgin(){
  if(state.currentQ>=state.questions.length){state.questions=shuffle(PIDGIN_PHRASES);state.currentQ=0;}
  const q=state.questions[state.currentQ],qNum=state.answered.length+1;
  const ci=q.correctIndex!==undefined?q.correctIndex:q.options.indexOf(q.meaning);
  const sh=shuffleOptions({options:q.options,correctIndex:ci});state.currentShuffled=sh;
  app.innerHTML=`<div class="screen" style="padding-top:16px">
    ${gameHeader()}
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div style="color:rgba(255,248,240,.4);font-size:13px;margin-bottom:12px">Phrase ${qNum} — What does this mean?</div>
      <div class="glass" style="padding:28px;margin-bottom:28px;text-align:center">
        <div style="color:rgba(255,248,240,.4);font-size:12px;margin-bottom:8px;letter-spacing:1px">PIDGIN</div>
        <p class="display" style="font-weight:700;font-size:28px;color:var(--green-light);line-height:1.3">“${q.pidgin}”</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${sh.options.map((o,i)=>`<button class="opt-btn" onclick="answerPidgin(${i})">${o}</button>`).join("")}
      </div>
    </div>
  </div>${state.showStreak?`<div class="streak-badge">${state.streakText}</div>`:''}`;
}

function answerPidgin(idx){
  if(state.frozen)return;
  const q=state.questions[state.currentQ],ci=state.currentShuffled.correctIndex,ok=idx===ci;
  const btns=document.querySelectorAll(".opt-btn");
  btns.forEach((b,i)=>{b.disabled=true;if(i===ci)b.classList.add("correct");if(i===idx&&!ok)b.classList.add("wrong");});
  state.answered.push({question:{question:'"'+q.pidgin+'" means...',realStory:{fact:q.meaning,date:"",source:"Nigerian Pidgin"}},correct:ok});
  if(ok){handleCorrect();setTimeout(()=>advanceQuestion(),600);}
  else handleWrong();
}

// ============================================================
// END GAME + RESULTS
// ============================================================

function endGame(){
  if(state.timerInterval){clearInterval(state.timerInterval);state.timerInterval=null;}
  state.lastResult={score:state.score,correctAnswers:state.correct,answeredQuestions:state.answered,bestStreak:state.bestStreak,timeUsed:66-state.timeLeft,gameId:state.selectedGame};
  profile.totalScore+=state.score;profile.gamesPlayed++;profile.totalCorrect+=state.correct;
  profile.totalAnswered+=state.answered.length;profile.highScore=Math.max(profile.highScore,state.score);
  profile.bestStreak=Math.max(profile.bestStreak,state.bestStreak);
  if(state.selectedZone&&!profile.completedZones.includes(state.selectedZone)){profile.completedZones.push(state.selectedZone);state.completedZones=[...profile.completedZones];}
  state.totalScore=profile.totalScore;state.gamesPlayed=profile.gamesPlayed;
  checkAchievements();saveProfile(profile);go("game-result");
}

    <p class="fade-up fade-up-d2" style="color:rgba(255,248,240,.6);font-size:16px;margin-bottom:32px;max-width:300px">${rm}</p>

      <div class="glass" style="padding:16px 12px"><div class="display" style="font-weight:700;font-size:24px;color:var(--green-light)">${r.correctAnswers}</div><div style="color:rgba(255,248,240,.4);font-size:11px;margin-top:4px">correct</div></div>
      <div class="glass" style="padding:16px 12px"><div class="display" style="font-weight:700;font-size:24px;color:var(--gold)">${acc}%</div><div style="color:rgba(255,248,240,.4);font-size:11px;margin-top:4px">accuracy</div></div>
      <div class="glass" style="padding:16px 12px"><div class="display" style="font-weight:700;font-size:24px;color:var(--coral)">${r.bestStreak}</div><div style="color:rgba(255,248,240,.4);font-size:11px;margin-top:4px">best streak</div></div>

      ${r.answeredQuestions.some(a=>a.question.realStory&&a.question.realStory.fact)?'<button class="btn-gold" onclick="go(\'real-story\')">The Real Stories</button>':''}
      <button class="btn-coral" onclick="go('pride-card')">Share Your Pride Card</button>
      <div style="display:flex;gap:12px">
        <button class="btn-outline" style="flex:1" onclick="startGame()">Play Again</button>
        <button class="btn-outline" style="flex:1;color:rgba(255,248,240,.6)" onclick="go('game-select')">Other Games</button>
      </div>
      <button class="btn-outline" style="color:rgba(255,248,240,.4)" onclick="state.selectedZone=null;go('map-hub')">Back to Map</button>

}

    const s=a.question.realStory;
    return`<div class="glass fade-up" style="padding:20px;animation-delay:${i*.08}s">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:20px">${a.correct?'✅':'❌'}</span>

      </div>
      <p style="font-size:15px;line-height:1.6;margin-bottom:12px;color:rgba(255,248,240,.85)">${s.fact}</p>
      ${s.source?`<div style="color:rgba(255,248,240,.3);font-size:12px">Source: ${s.source}</div>`:''}
    </div>`;
  }).join("");
  app.innerHTML=`<div class="screen">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
      <h1 class="display" style="font-weight:700;font-size:24px">The Real Stories</h1>

    <p style="color:rgba(255,248,240,.5);font-size:14px;margin-bottom:24px">Every question is powered by a real Nigerian achievement.</p>
    <div style="display:flex;flex-direction:column;gap:16px">${stories}</div>
  </div>`;
}

function submitLead(){
  const whats=document.getElementById("leadWhats");
  const email=document.getElementById("leadEmail");
  const whatsVal=whats?whats.value.trim():"";
  const emailVal=email?email.value.trim():"";
  
  if(!whatsVal){
    if(whats){whats.style.borderColor="var(--coral)";whats.placeholder="Enter your WhatsApp number first!";}
    return;
  }
  
  try{
    const lead={
      displayName:profile.displayName||"",
      whatsapp:whatsVal,
      email:emailVal,
      stateOfOrigin:profile.stateOfOrigin||"",
      ageTier:profile.ageTier||"",
      totalScore:profile.totalScore||0,
      gamesPlayed:profile.gamesPlayed||0,
      highScore:profile.highScore||0,
      bestStreak:profile.bestStreak||0,
      capturedAt:Date.now(),
      gameId:state.lastResult?state.lastResult.gameId:"",
      lastScore:state.lastResult?state.lastResult.score:0
    };
    let leads=[];
    try{leads=JSON.parse(localStorage.getItem("naija66_leads")||"[]");}catch(e){}
    leads.push(lead);
    localStorage.setItem("naija66_leads",JSON.stringify(leads));
    profile.leadCaptured=true;
    saveProfile(profile);
  }catch(e){}
  
  render();
}

function copyShare(){
  const r=state.lastResult,g=GAMES.find(x=>x.id===r.gameId)||GAMES[0];
  const t=`Omo see my score \u{1F62D}\u{1F1F3}\u{1F1EC} I scored ${r.score} on ${g.title} in Naija 66! Try beat am \u{1F449} naija66.ng #Naija66 #NigeriaAt66`;
  try{navigator.clipboard.writeText(t).then(()=>{const b=document.querySelector('[onclick="copyShare()"]');if(b){b.textContent="Copied!";setTimeout(()=>{b.textContent="Copy Link";},2000);}});}catch(e){}
}

// NAVIGATION
// ============================================================

function go(screen){state.screen=screen;render();window.scrollTo(0,0);}
render();
</script>
